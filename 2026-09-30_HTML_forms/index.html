<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>HTML Forms</h1>

    <form action="mailto:KNE260483@spengergasse.at" method="post" enctype="text/plain">
        <label for="Vorname">Vorname:</label>
        <input type="text" name="Vorname"required><br><br>
        <label for="Nachname">Nachname:</label>
        <input type="text" name="Nachname"required><br><br>
        <label for="Email">Email:</label>
        <input type="email" name="Email"required><br><br>
        <label for="Geschlecht">Geschlecht:</label><br>
        <input type="radio" name="Geschlecht" value="Männlich" required>Männlich<br>
        <input type="radio" name="Geschlecht" value="Weiblich" required>Weiblich<br>
        <input type="radio" name="Geschlecht" value="Divers" required>Divers <br><br>
        <label for="Matura">Matura:</label>
        <input type="Checkbox" name="Matura" value="Matura" required>Ja<br><br>
        <label for="Lieblingsfach">Lieblingsfach:</label>
        <select name="Lieblingsfach" required>
            <option value="Mathematik">WMC</option>
            <option value="Deutsch">WMC</option>
            <option value="Englisch">WMC</option>
            <option value="Informatik">WMC</option>
        </select><br><br>
        <label for="Angerechnete Fächer">Angerechnete Fächer:</label>
        <select name="Angerechnete Fächer" multiple>
            <option value="Ethik/Religion">Ethik/Religion</option>
            <option value="WMC">WMC</option>
            <option value="NSCS">NSCS</option>
            <option value="POS">POS</option>
            <option value="DBI">DBI</option>
            <option value="DSAI">DSAI</option>
            <option value="WIR">WIR</option>
            <option value="PRE">PRE</option>
            <option value="CABS">CABS</option>
            <option value="BWM">BWM</option>
        </select><br><br>
        <label for="Kommentar">Kommentar:</label>
        <textarea name="Kommentar" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
